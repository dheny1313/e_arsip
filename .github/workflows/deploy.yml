name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Files to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup PHP & Install Composer (WAJIB DILAKUKAN TERLEBIH DAHULU)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP proyek Anda

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # 2. Setup Node.js & Build Assets (BARU DILAKUKAN SETELAH VENDOR TERSEDIA)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps # Atau: npm install --legacy-peer-deps

      - name: Build Assets
        run: npm run build

      # 2. Upload file ke cPanel via FTP
      - name: 📂 Upload Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # karena di akun ftp sudha dibuat khusus ke folder /laravel_core 
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .env
            .env.*
            **/tests/**
            phpunit.xml
            README.md
            .editorconfig
            .vscode/**
            .idea/**
            storage/logs/*
            storage/framework/cache/data/*
            storage/framework/sessions/*
            storage/framework/views/*
            public/hot
