name: Deploy via FTP versi 2

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Files to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 1. Build CSS/JS UI (Vite) di Runner GitHub
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install & Build UI Assets
        run: |
          npm ci
          npm run build

      # 2. Upload Core Laravel & File Blade
      - name: 📂 Upload Core Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: laravel_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .env
            .env.*
            **/tests/**
            phpunit.xml
            README.md
            .editorconfig
            .vscode/**
            .idea/**
            storage/logs/*
            storage/framework/cache/data/*
            storage/framework/sessions/*
            storage/framework/views/*
            public/hot

      # 3. (OPSIONAL) Upload Assets Public jika folder public-mu dipisah ke public_html
      # Hapus tanda komentar (#) di bawah ini jika UI asset dipisah ke public_html
      # - name: 🌐 Upload Public Assets
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: public/
      #     server-dir: public_html/nama-domain-atau-folder-public/
      #     exclude: |
      #       hot
